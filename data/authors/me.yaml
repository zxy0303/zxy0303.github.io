bio: |
Hi, I am **Xinyuan Zhao (赵鑫源)**. I am currently a master's student at the [College of Computer Science and Artificial Intelligence, Fudan University](https://ai.fudan.edu.cn/) and a member of the [**Big Data and Networking (DataNET) Group**](https://fudan-datanet.mysxl.cn/). I joined DataNET in 2025 and am advised by [**Prof. Yang Chen**](https://chenyang03.wordpress.com/).

  I completed my undergraduate studies at the [School of Computer Science and Technology (School of Cyberspace Security), Xinjiang University](https://it.xju.edu.cn/).

  My current research interests include interdisciplinary research at the intersection of computer science and medicine, as well as applications of large language models. I am also open to exploring new research directions, particularly problems that are intellectually challenging, practically relevant, and capable of creating meaningful impact.

  I am always open to exchanging ideas and exploring potential collaborations. Please feel free to reach out to me via email.

