bio: |
  你好，我是**赵鑫源（Xinyuan Zhao）**。我目前在[复旦大学计算机科学与人工智能学院](https://ai.fudan.edu.cn/)攻读硕士学位，是[大数据与网络（DataNET）研究组](https://fudan-datanet.mysxl.cn/)的成员。我于 2025 年加入研究组，导师是[陈阳教授](https://chenyang03.wordpress.com/)。

  我本科毕业于[新疆大学计算机科学与技术学院（网络空间安全学院）](https://it.xju.edu.cn/)。

  欢迎交流想法，也期待探索合作机会。

